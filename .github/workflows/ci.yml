name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    name: Engine tests (WearIQKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test engines
        working-directory: WearIQKit
        run: swift test

  ios:
    name: iOS build & app tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test
        run: |
          xcodebuild test \
            -project WearIQ.xcodeproj \
            -scheme WearIQ \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: d.get(k) for k in ('result','totalTestCount','passedTests','failedTests','skippedTests')})" || true
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact | python3 -c "
          import json, sys
          def walk(n, depth=0):
              if n.get('nodeType') in ('UI test bundle', 'Test Case') and 'UITests' in json.dumps(n): print(n.get('name'), n.get('result'))
              for c in n.get('children', []): walk(c, depth + 1)
          for n in json.load(sys.stdin).get('testNodes', []): walk(n)" || true
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact | python3 -c "import json,sys; d=json.load(sys.stdin); [print(f['testIdentifierString'], '::', f['failureText']) for f in d.get('testFailures', [])]" || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
