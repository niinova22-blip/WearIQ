name: Update App Store listing

# Pushes store/metadata.json (names, subtitles, descriptions, keywords, URLs, categories,
# review notes) to the App Store version in "Prepare for Submission". With a screenshots
# run ID it also replaces the 6.9" screenshots with that run's "screenshots" artifact.

on:
  workflow_dispatch:
    inputs:
      screenshots_run_id:
        description: Run ID of an "App Store screenshots" run (optional)
        required: false

env:
  ASC_APP_ID: "6828076171"

jobs:
  listing:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        if: inputs.screenshots_run_id != ''
        with:
          name: screenshots
          path: shots
          run-id: ${{ inputs.screenshots_run_id }}
          github-token: ${{ github.token }}

      - name: Update listing
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.9.0"
          SHOTS=""
          [ -d shots ] && SHOTS=shots
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/venv/bin/python" scripts/asc_metadata.py \
            "$ASC_APP_ID" store/metadata.json $SHOTS
          rm -f "$RUNNER_TEMP/AuthKey.p8"
