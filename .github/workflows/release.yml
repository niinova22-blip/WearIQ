name: Release to TestFlight

# Archives the app, signs it and uploads it to App Store Connect / TestFlight.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID            Apple Developer Team ID (Membership page)
#   ASC_KEY_ID               App Store Connect API key ID (Admin role: it creates certificates)
#   ASC_ISSUER_ID            App Store Connect API issuer ID
#   ASC_KEY_P8               Contents of the AuthKey_XXXX.p8 file
# Repository variables (not secret, but required for Release builds with real ads):
#   ADMOB_APP_ID             ca-app-pub-…~…
#   ADMOB_BANNER_ID          ca-app-pub-…/…
#   ADMOB_INTERSTITIAL_ID    ca-app-pub-…/…
#
# Signing is manual on purpose. The account holder's name contains a non-ASCII character,
# and Xcode's cloud signing then produces a designated requirement that App Store
# validation rejects (ITMS-90035). Each run creates a distribution certificate and an
# App Store profile through the API and signs with a Team ID based requirement.
#
# The certificate must stay valid until Apple has processed the upload (minutes later),
# otherwise processing fails with ITMS-90034. So a run does not revoke its own
# certificate: it stores the IDs as an artifact, and the next run revokes them first.

on:
  workflow_dispatch:
    inputs:
      unlock_premium:
        description: Unlock Premium for testers (turn OFF for App Store submission builds)
        type: boolean
        default: true
  push:
    tags: ["v*"]

env:
  BUNDLE_ID: com.niinova.weariq

permissions:
  contents: read
  actions: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$ADMOB_APP_ID" ] && missing="$missing ADMOB_APP_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Select Xcode
        # App Store uploads must be built with a current SDK, so take the newest stable Xcode.
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Inject production ad IDs
        run: |
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ${{ vars.ADMOB_APP_ID }}" WearIQ/Info.plist
          /usr/libexec/PlistBuddy -c "Set :WQBannerAdUnitID ${{ vars.ADMOB_BANNER_ID }}" WearIQ/Info.plist
          /usr/libexec/PlistBuddy -c "Set :WQInterstitialAdUnitID ${{ vars.ADMOB_INTERSTITIAL_ID }}" WearIQ/Info.plist
          # Tag pushes (store submissions) never unlock Premium.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.unlock_premium }}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Add :WQUnlockPremium bool true" WearIQ/Info.plist
            echo "::notice::Premium unlocked for testers in this build"
          fi

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project WearIQ.xcodeproj -scheme WearIQ -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WearIQ.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet

      - name: Revoke the previous run's signing assets
        env:
          GH_TOKEN: ${{ github.token }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.9.0"
          OLD="$RUNNER_TEMP/old-signing"
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey-old.p8"
          # Earlier runs that left their certificate for Apple's processing.
          for id in $(gh run list --workflow release.yml --status completed -L 10 --json databaseId -q '.[].databaseId'); do
            rm -rf "$OLD" && mkdir -p "$OLD"
            if gh run download "$id" -n signing-ids -D "$OLD" 2>/dev/null; then
              ASC_KEY_PATH="$RUNNER_TEMP/AuthKey-old.p8" "$RUNNER_TEMP/venv/bin/python" scripts/asc_signing.py cleanup "$OLD" || true
            fi
          done
          rm -f "$RUNNER_TEMP/AuthKey-old.p8"

      - name: Create signing certificate and profile
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          SIGN_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN_DIR"
          echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          printf '%s' "$P8" > "$SIGN_DIR/AuthKey.p8"

          # LibreSSL in /usr/bin writes PKCS#12 files that `security import` accepts.
          /usr/bin/openssl genrsa -out "$SIGN_DIR/dist.key" 2048
          /usr/bin/openssl req -new -key "$SIGN_DIR/dist.key" -out "$SIGN_DIR/dist.csr" -subj "/CN=WearIQ CI/C=TR"
          ASC_KEY_PATH="$SIGN_DIR/AuthKey.p8" "$RUNNER_TEMP/venv/bin/python" scripts/asc_signing.py \
            create "$SIGN_DIR/dist.csr" "$SIGN_DIR" "$BUNDLE_ID" "WearIQ CI ${{ github.run_id }}"

          /usr/bin/openssl x509 -inform DER -in "$SIGN_DIR/dist.cer" -out "$SIGN_DIR/dist.pem"
          P12_PASS="$(openssl rand -hex 12)"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN_DIR/dist.key" -in "$SIGN_DIR/dist.pem" \
            -out "$SIGN_DIR/dist.p12" -passout "pass:$P12_PASS"

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          curl -fsSL -o "$SIGN_DIR/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$SIGN_DIR/wwdr.cer" -k "$KEYCHAIN" -A || true
          security import "$SIGN_DIR/dist.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$SIGN_DIR/dist.key" "$SIGN_DIR/dist.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')"
          if [ -z "$IDENTITY" ]; then echo "::error::No signing identity in keychain"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign and package
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="$RUNNER_TEMP/WearIQ.xcarchive/Products/Applications/WearIQ.app"
          cp "$SIGN_DIR/app.mobileprovision" "$APP/embedded.mobileprovision"

          cat > "$SIGN_DIR/entitlements.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>$TEAM.$BUNDLE_ID</string>
            <key>com.apple.developer.team-identifier</key><string>$TEAM</string>
            <key>get-task-allow</key><false/>
            <key>beta-reports-active</key><true/>
          </dict></plist>
          EOF

          requirement() {
            echo "=designated => anchor apple generic and identifier \"$1\" and certificate leaf[subject.OU] = \"$TEAM\" and certificate 1[field.1.2.840.113635.100.6.2.1] /* exists */"
          }

          # Inner code first, then the app itself.
          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP"/Frameworks/*.framework; do
              [ -e "$fw" ] || continue
              FW_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$fw/Info.plist")"
              codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" --requirements "$(requirement "$FW_ID")" "$fw"
            done
            for lib in "$APP"/Frameworks/*.dylib; do
              [ -e "$lib" ] || continue
              codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" "$lib"
            done
          fi
          codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements "$SIGN_DIR/entitlements.plist" \
            --requirements "$(requirement "$BUNDLE_ID")" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP" 2>&1 | grep designated

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry ../WearIQ.ipa Payload)

      - name: Upload to TestFlight
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$SIGN_DIR/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/WearIQ.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Uploaded build: keep the certificate until Apple has processed it; the next run
      # revokes it. Anything else (failed build or upload): revoke right away.
      - name: Keep signing IDs for the next run
        if: steps.upload.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/signing-ids"
          cp "$SIGN_DIR/cert_id" "$SIGN_DIR/profile_id" "$RUNNER_TEMP/signing-ids/"
      - uses: actions/upload-artifact@v5
        if: steps.upload.outcome == 'success'
        with:
          name: signing-ids
          path: ${{ runner.temp }}/signing-ids
          retention-days: 30

      - name: Revoke unused signing assets and remove keys
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
        run: |
          if [ "$UPLOADED" != "true" ] && [ -n "$SIGN_DIR" ] && [ -f "$SIGN_DIR/AuthKey.p8" ]; then
            ASC_KEY_PATH="$SIGN_DIR/AuthKey.p8" "$RUNNER_TEMP/venv/bin/python" scripts/asc_signing.py cleanup "$SIGN_DIR" || true
          fi
          rm -rf "$SIGN_DIR" ~/.appstoreconnect/private_keys
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
