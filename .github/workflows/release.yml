name: Release to TestFlight

# Archives a signed build and uploads it to App Store Connect / TestFlight.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID            Apple Developer Team ID (Membership page)
#   ASC_KEY_ID               App Store Connect API key ID
#   ASC_ISSUER_ID            App Store Connect API issuer ID
#   ASC_KEY_P8               Contents of the AuthKey_XXXX.p8 file
# Repository variables (not secret, but required for Release builds with real ads):
#   ADMOB_APP_ID             ca-app-pub-…~…
#   ADMOB_BANNER_ID          ca-app-pub-…/…
#   ADMOB_INTERSTITIAL_ID    ca-app-pub-…/…

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$ADMOB_APP_ID" ] && missing="$missing ADMOB_APP_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Inject production ad IDs
        run: |
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ${{ vars.ADMOB_APP_ID }}" WearIQ/Info.plist
          /usr/libexec/PlistBuddy -c "Set :WQBannerAdUnitID ${{ vars.ADMOB_BANNER_ID }}" WearIQ/Info.plist
          /usr/libexec/PlistBuddy -c "Set :WQInterstitialAdUnitID ${{ vars.ADMOB_INTERSTITIAL_ID }}" WearIQ/Info.plist

      - name: Write API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project WearIQ.xcodeproj -scheme WearIQ -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WearIQ.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WearIQ.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
