name: App Store screenshots

# Builds the Debug app for a 6.9" iPhone simulator, captures each main screen in English
# using demo mode (WearIQ/App/DemoMode.swift), and turns them into the store's marketing
# images (scripts/store_shots.py). The "screenshots" artifact holds en/ (the store images)
# and raw/; scripts/asc_metadata.py pushes en/ to App Store Connect.

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot a Pro Max simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devs = json.load(sys.stdin)['devices']
          ios = sorted((k for k in devs if 'iOS' in k), key=lambda k: [int(n) for n in re.findall(r'\d+', k)])
          print(next(d['udid'] for k in reversed(ios) for d in devs[k] if d['name'].endswith('Pro Max')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 --dataNetwork wifi

      - name: Build
        run: |
          xcodebuild build -project WearIQ.xcodeproj -scheme WearIQ -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= SWIFT_OPTIMIZATION_LEVEL=-O -quiet
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/WearIQ.app"

      - name: Capture
        run: |
          # English and Turkish: each listing shows the app in its own language.
          for lang in en tr; do
            locale=$([ "$lang" = tr ] && echo tr_TR || echo en_US)
            mkdir -p "raw/$lang"
            for screen in result body avatar profile scan memory style passport home paywall; do
              xcrun simctl launch "$UDID" com.niinova.weariq -WQDemo "$screen" -AppleLanguages "($lang)" -AppleLocale "$locale" > /dev/null
              # The avatar is cut and draped first (several seconds on the simulator).
              case "$screen" in avatar) sleep 75 ;; body) sleep 30 ;; *) sleep 8 ;; esac
              xcrun simctl io "$UDID" screenshot "raw/$lang/${screen}.png"
              xcrun simctl terminate "$UDID" com.niinova.weariq || true
            done
          done

      - name: Compose store images
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==11.0.0
          mkdir -p fonts
          curl -sfL -o fonts/DMSerifDisplay.ttf https://github.com/google/fonts/raw/main/ofl/dmserifdisplay/DMSerifDisplay-Regular.ttf
          curl -sfL -o fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          for lang in en tr; do
            "$RUNNER_TEMP/venv/bin/python" scripts/store_shots.py "raw/$lang" "shots/$lang" fonts/DMSerifDisplay.ttf fonts/Inter.ttf "$lang"
          done
          mkdir -p shots/raw && cp raw/en/paywall.png shots/raw/paywall.png
          cp -R raw shots/raw/all

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: shots
