name: WearIQ
options:
  bundleIdPrefix: com.niinova
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID (App Store Connect → Membership)
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  WearIQKit:
    path: WearIQKit

targets:
  WearIQ:
    type: application
    platform: iOS
    sources:
      - path: WearIQ
    dependencies:
      - package: WearIQKit
        product: WearIQCore
      - package: WearIQKit
        product: FitEngine
      - package: WearIQKit
        product: BodyMeasurementEngine
      - package: WearIQKit
        product: ProductMeasurementParser
      - package: WearIQKit
        product: ScanQuota
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq
        PRODUCT_NAME: WearIQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WearIQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "WearIQ uses the camera to scan your body measurements and read barcodes or size labels. Photos are processed on your device and are not uploaded."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "WearIQ reads size chart screenshots and garment photos you choose. They are processed on your device."
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Allowing tracking lets us show more relevant ads. Your body measurements are never shared with advertisers."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic

  WearIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WearIQTests
    dependencies:
      - target: WearIQ
      - package: WearIQKit
        product: WearIQCore
      - package: WearIQKit
        product: ScanQuota
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq.tests

schemes:
  WearIQ:
    build:
      targets:
        WearIQ: all
        WearIQTests: [test]
    test:
      targets:
        - WearIQTests
      gatherCoverageData: true
