name: WearIQ
options:
  bundleIdPrefix: com.niinova
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID (App Store Connect → Membership)
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  WearIQKit:
    path: WearIQKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0

targets:
  WearIQ:
    type: application
    platform: iOS
    sources:
      - path: WearIQ
        excludes:
          - "Resources/WearIQ.storekit"
    dependencies:
      - package: WearIQKit
        product: WearIQCore
      - package: WearIQKit
        product: FitEngine
      - package: WearIQKit
        product: BodyMeasurementEngine
      - package: WearIQKit
        product: BodyScanVision
      - package: WearIQKit
        product: ProductMeasurementParser
      - package: WearIQKit
        product: ScanQuota
      - package: WearIQKit
        product: OutfitRecommendationEngine
      - package: WearIQKit
        product: AvatarEngine
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - target: WearIQShare
        embed: true
      - target: WearIQWidget
        embed: true
      - target: WearIQSafari
        embed: true
      - package: WearIQKit
        product: ShoppingAssistant
      - sdk: HealthKit.framework
    info:
      path: WearIQ/Info.plist
      properties:
        # Keychain group shared with the widget (no app group needed); see WidgetSnapshot.
        WQKeychainGroup: $(DEVELOPMENT_TEAM).com.niinova.weariq.shared
        # AdMob: Google's public TEST app id until the real one is provided.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        WQBannerAdUnitID: ca-app-pub-3940256099942544/2435281174
        WQInterstitialAdUnitID: ca-app-pub-3940256099942544/4411468910
        # Google's list of SKAdNetwork IDs for AdMob and its third-party buyers.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        UILaunchScreen: {}
        # Followed products are re-checked in the background (price drop, size back in stock).
        BGTaskSchedulerPermittedIdentifiers: [com.niinova.weariq.track]
        UIBackgroundModes: [fetch]
        # weariq://check?url=… opens a product from the share extension.
        CFBundleURLTypes:
          - CFBundleURLName: com.niinova.weariq
            CFBundleURLSchemes: [weariq]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq
        # iPhone only; XcodeGen's iOS preset would otherwise add iPad at target level,
        # and an iPad build must support every orientation.
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        PRODUCT_NAME: WearIQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WearIQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "WearIQ uses the camera to scan your body measurements and read barcodes or size labels. Photos are processed on your device and are not uploaded."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "WearIQ reads size chart screenshots and garment photos you choose. They are processed on your device."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "WearIQ never writes to Health. It only reads your latest weight, if you turn that on."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "If you turn it on, WearIQ reads your latest weight to tell you when your measurements may have changed. Nothing is written to Health and nothing leaves your phone."
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Allowing tracking lets us show more relevant ads. Your body measurements are never shared with advertisers."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic

  # "Share → WearIQ" from a store app or Safari.
  WearIQShare:
    type: app-extension
    platform: iOS
    sources:
      - path: WearIQShare
    info:
      path: WearIQShare/Info.plist
      properties:
        CFBundleDisplayName: WearIQ
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq.share
        PRODUCT_NAME: WearIQShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WearIQ
        CODE_SIGN_STYLE: Automatic

  # Safari Web Extension: the smart shopping memory (your size on clothing pages).
  WearIQSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: WearIQSafari/SafariWebExtensionHandler.swift
      # At the root of the extension, where Safari looks for them.
      - path: WearIQSafari/Resources/manifest.json
        buildPhase: resources
      - path: WearIQSafari/Resources/background.js
        buildPhase: resources
      - path: WearIQSafari/Resources/content.js
        buildPhase: resources
      - path: WearIQSafari/Resources/_locales
        type: folder
        buildPhase: resources
      - path: WearIQSafari/Resources/images
        type: folder
        buildPhase: resources
      - path: WearIQ/SharedShopping
    dependencies:
      - package: WearIQKit
        product: ShoppingAssistant
      - package: WearIQKit
        product: FitEngine
      - package: WearIQKit
        product: ProductMeasurementParser
      - package: WearIQKit
        product: WearIQCore
    info:
      path: WearIQSafari/Info.plist
      properties:
        CFBundleDisplayName: WearIQ
        WQKeychainGroup: $(DEVELOPMENT_TEAM).com.niinova.weariq.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq.safari
        PRODUCT_NAME: WearIQSafari
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WearIQ
        CODE_SIGN_STYLE: Automatic

  # Home screen widget: followed products and the latest checks.
  WearIQWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WearIQWidget
      - path: WearIQ/Shared
    info:
      path: WearIQWidget/Info.plist
      properties:
        CFBundleDisplayName: WearIQ
        WQKeychainGroup: $(DEVELOPMENT_TEAM).com.niinova.weariq.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq.widget
        PRODUCT_NAME: WearIQWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WearIQ
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic

  WearIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WearIQTests
      - path: WearIQ/Resources/WearIQ.storekit
        buildPhase: resources
    dependencies:
      - target: WearIQ
      - package: WearIQKit
        product: WearIQCore
      - package: WearIQKit
        product: ScanQuota
      - package: WearIQKit
        product: FitEngine
      - package: WearIQKit
        product: ProductMeasurementParser
      - package: WearIQKit
        product: BodyMeasurementEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq.tests

  WearIQUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WearIQUITests
    dependencies:
      - target: WearIQ
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.weariq.uitests
        TEST_TARGET_NAME: WearIQ

schemes:
  WearIQ:
    build:
      targets:
        WearIQ: all
        WearIQTests: [test]
        WearIQUITests: [test]
    run:
      storeKitConfiguration: WearIQ/Resources/WearIQ.storekit
    test:
      targets:
        - WearIQTests
        - WearIQUITests
      gatherCoverageData: true
